[project]
name = "desktop-image-worldcup"
version = "0.1.0"
description = "로컬 이미지로 진행하는 데스크톱 이상형 월드컵"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Pillow==12.3.0",
]

[dependency-groups]
dev = [
    "pyinstaller==6.22.3",
    "pytest>=8.3,<10",
]

[tool.uv]
package = false
required-version = "==0.12.18"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
